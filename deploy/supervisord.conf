[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
user=app
command=Xvfb :99 -screen 0 %(ENV_SCREEN_GEOMETRY)s -nolisten tcp -ac
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
user=app
command=openbox
priority=20
autorestart=true
environment=DISPLAY=":99",HOME="/home/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
user=app
; so no loopback: o unico caminho externo e o noVNC atras do Caddy com senha
command=x11vnc -display :99 -localhost -nopw -forever -shared -rfbport 5900 -noxdamage
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:websockify]
user=app
command=websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:creatorhub]
user=app
command=/app/deploy/run-app.sh
priority=50
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
environment=DISPLAY=":99",HOME="/home/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
user=app
command=caddy run --config /app/deploy/Caddyfile --adapter caddyfile
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
